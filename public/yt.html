<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="1;url=https://www.youtube.com/@aiju-yu">
<title>YouTubeへ移動します</title>
<!--
  InstagramのプロフィールからYouTubeへ送る中継ページ（sitemap外）。
  scripts/life_metrics.py が Cloudflare Web Analytics でこのページの表示数を数える。
  301だとページが読み込まれず計測ビーコンが動かないので、HTMLを1枚はさむ。
  移動を急ぎすぎるとビーコンが送られないので、loadのあと少し待つ。
-->
<style>
  body { font-family: "Noto Sans JP", sans-serif; background: #f7f8fa; color: #1a3a5c; margin: 0; padding: 48px 16px; text-align: center; }
  a { color: #1a3a5c; font-weight: 700; }
</style>
</head>
<body>
<p>YouTubeへ移動します。</p>
<p><a href="https://www.youtube.com/@aiju-yu">移動しないときはこちら</a></p>
<script>
  window.addEventListener("load", function () {
    setTimeout(function () { location.replace("https://www.youtube.com/@aiju-yu"); }, 500);
  });
</script>
</body>
</html>
